name: Veille offres

on:
  schedule:
    - cron: '37 */6 * * *' # toutes les 6 h : 1h37, 7h37, 13h37, 19h37 (heure de Paris en hiver)
  workflow_dispatch: # bouton "Run workflow" pour lancer à la main
    inputs:
      demo:
        description: "Envoyer seulement des offres d'exemple (aperçu de la mise en forme)"
        type: boolean
        default: false

permissions:
  contents: write # pour sauvegarder data/seen.json

concurrency:
  group: veille-offres
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Offres d'exemple
        if: ${{ inputs.demo }}
        run: npm run demo
        env:
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Chercher les offres et envoyer sur Discord
        if: ${{ !inputs.demo }}
        run: npm start
        env:
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FRANCE_TRAVAIL_CLIENT_ID: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
          FRANCE_TRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}
          LBA_API_KEY: ${{ secrets.LBA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
          MIN_SCORE: ${{ vars.MIN_SCORE || '6' }}
          MAX_AGE_DAYS: ${{ vars.MAX_AGE_DAYS || '7' }}

      - name: Sauvegarder les offres déjà vues
        if: ${{ !inputs.demo }}
        run: |
          git config user.name "veille-offres-bot"
          git config user.email "veille-offres-bot@users.noreply.github.com"
          git add data/seen.json
          git diff --cached --quiet || git commit -m "chore: maj offres vues [skip ci]"
          git pull --rebase origin main
          git push
